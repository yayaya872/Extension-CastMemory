<div class="cm-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>🎭 Cast Memory</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="cm-row">
                <label class="checkbox_label" for="cm_enabled">
                    <input type="checkbox" id="cm_enabled" />
                    <span>Cast Memory を有効化</span>
                </label>
            </div>

            <div class="cm-status-box" id="cm_status">—</div>
            <div class="cm-hint" id="cm_diag">diag: —</div>

            <div class="cm-button-row">
                <button class="menu_button cm-act-open" type="button">
                    <i class="fa-solid fa-window-restore"></i> シートを開く
                </button>
            </div>

            <hr class="cm-divider" />

            <h4 class="cm-section-title2">📏 しきい値</h4>

            <div class="cm-row">
                <label for="cm_tail">
                    <span>生のまま残す直近メッセージ数</span>
                    <small class="cm-hint">新しい方からこの件数は常に原文のまま送られます。記憶に書かれた範囲でも、この範囲は隠れません。</small>
                </label>
                <input id="cm_tail" type="number" class="text_pole" min="0" step="1" />
            </div>

            <div class="cm-row">
                <label for="cm_threshold">
                    <span>場面の途中締めトークン数（推定）</span>
                    <small class="cm-hint">場面が続いていても、未書込分がこの量を超えたら途中で記憶に書き出します。全員ログアウトした場面は、この量に関係なく締まります。</small>
                </label>
                <input id="cm_threshold" type="number" class="text_pole" min="1000" step="500" />
            </div>

            <div class="cm-row">
                <label for="cm_budget">
                    <span>注入する記憶の予算（トークン）</span>
                    <small class="cm-hint">プロンプトに入れる記憶セクション（ワールド記憶＋登場中キャラの記憶）の上限。名簿とワールド設定は常に全量入ります。</small>
                </label>
                <input id="cm_budget" type="number" class="text_pole" min="500" step="250" />
            </div>

            <div class="cm-row">
                <label for="cm_fold">
                    <span>長期記憶へ統合する文字数</span>
                    <small class="cm-hint">キャラごと（とワールド）の記憶がこの文字数を超えたら、古い分を長期記憶に統合します。</small>
                </label>
                <input id="cm_fold" type="number" class="text_pole" min="1000" step="500" />
            </div>

            <hr class="cm-divider" />

            <h4 class="cm-section-title2">🔌 記憶を書くモデル（サブ）の接続</h4>

            <div class="cm-row">
                <label for="cm_source">
                    <span>接続方法</span>
                </label>
                <select id="cm_source" class="text_pole">
                    <option value="default">メインAPI（デフォルト）</option>
                    <option value="profile">接続プロファイル</option>
                    <option value="openai">OpenAI互換</option>
                    <option value="ollama">Ollama</option>
                </select>
            </div>

            <div class="cm-row">
                <label for="cm_resp_len">
                    <span>サブモデルの最大応答トークン（0 = デフォルト）</span>
                </label>
                <input id="cm_resp_len" type="number" class="text_pole" min="0" step="100" />
            </div>

            <div id="cm_profile_wrap" class="cm-sub-panel" style="display:none">
                <div class="cm-row">
                    <label for="cm_profile">
                        <span>接続プロファイル</span>
                    </label>
                    <select id="cm_profile" class="text_pole"></select>
                </div>
            </div>

            <div id="cm_openai_wrap" class="cm-sub-panel" style="display:none">
                <div class="cm-row">
                    <label for="cm_oai_url"><span>API URL</span></label>
                    <input id="cm_oai_url" type="text" class="text_pole" placeholder="https://example.com/v1" />
                </div>
                <div class="cm-row">
                    <label for="cm_oai_key"><span>APIキー</span></label>
                    <input id="cm_oai_key" type="password" class="text_pole" placeholder="(任意)" />
                </div>
                <div class="cm-row">
                    <label for="cm_oai_model"><span>モデル</span></label>
                    <input id="cm_oai_model" type="text" class="text_pole" placeholder="model-name" />
                </div>
            </div>

            <div id="cm_ollama_wrap" class="cm-sub-panel" style="display:none">
                <div class="cm-row">
                    <label for="cm_ollama_url"><span>Ollama URL</span></label>
                    <input id="cm_ollama_url" type="text" class="text_pole" placeholder="http://localhost:11434" />
                </div>
                <div class="cm-row">
                    <label for="cm_ollama_model"><span>モデル</span></label>
                    <input id="cm_ollama_model" type="text" class="text_pole" placeholder="llama3.1" />
                </div>
            </div>

            <hr class="cm-divider" />

            <div class="inline-drawer">
                <div class="inline-drawer-toggle inline-drawer-header">
                    <b>📝 サブモデルのプロンプト</b>
                    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
                </div>
                <div class="inline-drawer-content">
                    <div class="cm-row">
                        <label for="cm_writer_sys"><span>記憶書き込み — システム</span></label>
                        <textarea id="cm_writer_sys" class="text_pole cm-textarea" rows="2"></textarea>
                    </div>
                    <div class="cm-row">
                        <label for="cm_writer_user"><span>記憶書き込み — ユーザー</span>
                            <small class="cm-hint">プレースホルダ: {{story_txt}}, {{participants}}, {{world_so_far}}, {{player_name}}</small>
                        </label>
                        <textarea id="cm_writer_user" class="text_pole cm-textarea" rows="10"></textarea>
                    </div>
                    <div class="cm-row">
                        <label for="cm_fold_user"><span>キャラ記憶の統合 — ユーザー</span>
                            <small class="cm-hint">プレースホルダ: {{memory_txt}}</small>
                        </label>
                        <textarea id="cm_fold_user" class="text_pole cm-textarea" rows="6"></textarea>
                    </div>
                    <div class="cm-row">
                        <label for="cm_wfold_user"><span>ワールド記憶の統合 — ユーザー</span>
                            <small class="cm-hint">プレースホルダ: {{memory_txt}}</small>
                        </label>
                        <textarea id="cm_wfold_user" class="text_pole cm-textarea" rows="6"></textarea>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
